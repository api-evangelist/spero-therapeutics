description: 'Spero Therapeutics is a clinical-stage biopharmaceutical company advancing
  innovative medicines for immune-mediated and infectious diseases. Its pipeline includes
  SP001, a third-generation anti-CD40L antibody targeting IgG4-related disease, alongside
  earlier programs in antibacterial and rare-disease therapeutics. Spero was surfaced
  as a portfolio company of GV and added to the API Evangelist network. As a life-sciences
  drug developer, Spero publishes a corporate and investor-relations web presence but
  no public developer API, developer portal, or technical integration surface; this
  profile captures its identity and probed domain-security posture.'
